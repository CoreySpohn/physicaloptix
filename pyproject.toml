[build-system]
requires = ['hatchling', "hatch-fancy-pypi-readme", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "physicaloptix"
description = "Physical optics (PSFs and diffraction) for the HWO direct imaging simulation suite"
authors = [{ name = "Corey Spohn", email = "corey.a.spohn@nasa.gov" }]
dynamic = ['readme', 'version']
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "equinox>=0.12.0",
    "hwoutils",
    "pyyaml",
    "jax>=0.4.1",
    "jaxlib>=0.4.1",
    "jaxtyping",
    "numpy",
    "optixstuff>=3.0.0",
]

[project.optional-dependencies]
dev = ["pre-commit"]
docs = [
    "sphinx",
    "myst-nb",
    "sphinx-book-theme",
    "sphinx-autoapi",
    "sphinx_autodoc_typehints",
    "sphinxcontrib-mermaid",
    "ipython",
    "matplotlib",
]
test = ["matplotlib", "nox", "pytest", "hypothesis", "pytest-cov", "scipy"]

[project.urls]
Homepage = "https://github.com/CoreySpohn/physicaloptix"
Issues = "https://github.com/CoreySpohn/physicaloptix/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/physicaloptix/_version.py"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "UP", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
# Docs example notebooks are teaching material: x64 config must precede the jax
# import (E402), and prose-length plotting lines and short names are fine here.
"docs/examples/*.ipynb" = ["E402", "E501", "E741", "B905", "D"]

[dependency-groups]
dev = [
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
# The default run is COMPLETE: the external-reference gates are the point of
# this suite, so nothing is deselected without the caller asking. A handful of
# gates rebuild a full yield package or a full EAC-1 chain and dominate the
# wall clock, so they carry `slow` and the inner development loop opts out
# with `-m "not slow"`. Note that `-n auto` is deliberately NOT set: the
# gates hold large x64 EAC-1 arrays and one worker per core exhausts memory
# long before parallelism pays.
markers = [
    "slow: rebuilds a full yield package or EAC-1 chain (tens of seconds up)",
]

[tool.hatch.build.targets.wheel]
packages = ["src/physicaloptix"]

[tool.hatch.build.targets.sdist]
exclude = ["/scripts", "/docs", "/tests", "/.github"]
